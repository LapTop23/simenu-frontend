// ---------------------------------------------------------------------------
// DEMO TRANSPORT — stands in for Socket.IO in this dependency-free preview.
//
// The real backend uses Socket.IO rooms (see src/sockets/index.js) so a
// customer's 'place-order' event reaches only ITS restaurant's admin
// dashboard, and an admin's 'update-order-status' reaches only the customer
// who placed that order. A static HTML file has no server to host that, so
// this bridge reproduces the exact same event names and payload shapes over
// `window.postMessage` between two browser tabs instead — open this file,
// click "Open Live Admin Dashboard", and place an order to see it arrive
// there instantly, then change its status to see it reflected back here.
// The real Next.js source (in this same delivery) uses actual
// socket.io/socket.io-client; nothing here is the production transport.
// ---------------------------------------------------------------------------
function createDemoBridge() {
  const listeners = {};
  let remoteWindow = null;

  window.addEventListener('message', (event) => {
    if (!event.data || event.data.__simenuDemo !== true) return;
    const { eventName, payload } = event.data;
    (listeners[eventName] || []).forEach((fn) => fn(payload));
  });

  return {
    on(eventName, fn) {
      (listeners[eventName] = listeners[eventName] || []).push(fn);
    },
    off(eventName, fn) {
      listeners[eventName] = (listeners[eventName] || []).filter((f) => f !== fn);
    },
    setRemote(win) {
      remoteWindow = win;
    },
    emit(eventName, payload) {
      if (remoteWindow && !remoteWindow.closed) {
        remoteWindow.postMessage({ __simenuDemo: true, eventName, payload }, '*');
      }
    },
  };
}

const demoBridge = createDemoBridge();
// Expose the incoming side to whichever window opened us (admin ↔ customer),
// so either tab can emit back to the other regardless of who opened whom.

// Cart context (mirrors context/CartContext.jsx from the delivered source)
// ---------------------------------------------------------------------------
const CartContext = createContext(null);

function buildCartLineId(itemId, modifiers) {
  const key = [...modifiers].map(m => `${m.groupName}:${m.optionName}`).sort().join('|');
  return `${itemId}__${key}`;
}

function cartReducer(state, action) {
  switch (action.type) {
    case 'ADD_ITEM': {
      const { itemId, name, basePrice, quantity, modifiers, image } = action.payload;
      const cartLineId = buildCartLineId(itemId, modifiers);
      const unitPrice = basePrice + modifiers.reduce((s, m) => s + (m.priceDelta || 0), 0);
      const existing = state.lines.find(l => l.cartLineId === cartLineId);
      if (existing) {
        return { lines: state.lines.map(l => l.cartLineId === cartLineId ? { ...l, quantity: l.quantity + quantity } : l) };
      }
      return { lines: [...state.lines, { cartLineId, itemId, name, basePrice, unitPrice, quantity, modifiers, image }] };
    }
    case 'UPDATE_QUANTITY': {
      const { cartLineId, quantity } = action.payload;
      if (quantity <= 0) return { lines: state.lines.filter(l => l.cartLineId !== cartLineId) };
      return { lines: state.lines.map(l => l.cartLineId === cartLineId ? { ...l, quantity } : l) };
    }
    case 'REMOVE_LINE':
      return { lines: state.lines.filter(l => l.cartLineId !== action.payload.cartLineId) };
    case 'CLEAR_CART':
      return { lines: [] };
    default:
      return state;
  }
}

function CartProvider({ children }) {
  const [state, dispatch] = useReducer(cartReducer, { lines: [] });
  const value = useMemo(() => {
    const totalItems = state.lines.reduce((s, l) => s + l.quantity, 0);
    const totalAmount = state.lines.reduce((s, l) => s + l.unitPrice * l.quantity, 0);
    return {
      lines: state.lines, totalItems, totalAmount,
      addItem: (item) => dispatch({ type: 'ADD_ITEM', payload: item }),
      updateQuantity: (cartLineId, quantity) => dispatch({ type: 'UPDATE_QUANTITY', payload: { cartLineId, quantity } }),
      removeLine: (cartLineId) => dispatch({ type: 'REMOVE_LINE', payload: { cartLineId } }),
      clearCart: () => dispatch({ type: 'CLEAR_CART' }),
    };
  }, [state]);
  return <CartContext.Provider value={value}>{children}</CartContext.Provider>;
}

function useCart() {
  const ctx = useContext(CartContext);
  if (!ctx) throw new Error('useCart must be used within CartProvider');
  return ctx;
}

        </div>
        <div className="mt-2 flex items-center justify-between">

          <button type="button" onClick={handleAdd} className="flex items-center gap-1 rounded-full bg-chili px-3 py-1.5 text-xs font-semibold text-paper shadow-sm shadow-chili/30 transition-transform duration-150 active:scale-95">
            <span className="text-sm leading-none">+</span>Add
          </button>
        </div>
      </div>
    </article>
  );
}

function ModifierSheet({ item, onConfirm, onClose }) {
  const [quantity, setQuantity] = useState(1);
  const [selections, setSelections] = useState({});

  const toggleOption = (group, optionName) => {
    setSelections(prev => {
      const current = prev[group.name] || [];
      if (group.selectionType === 'single') return { ...prev, [group.name]: [optionName] };
      const already = current.includes(optionName);
      return { ...prev, [group.name]: already ? current.filter(o => o !== optionName) : [...current, optionName] };
    });
  };

  const missingRequired = item.modifiers.find(g => g.isRequired && !(selections[g.name]?.length > 0));

  const flatModifiers = [];
  item.modifiers.forEach(group => {
    (selections[group.name] || []).forEach(optionName => {
      const option = group.options.find(o => o.name === optionName);
      if (option) flatModifiers.push({ groupName: group.name, optionName, priceDelta: option.priceDelta });
    });
  });

  const unitPrice = item.price + flatModifiers.reduce((s, m) => s + m.priceDelta, 0);

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center bg-ink/40">
      <div className="animate-slide-up flex max-h-[85vh] w-full max-w-lg flex-col rounded-t-3xl bg-white">
        <div className="flex justify-center pt-3"><span className="h-1 w-10 rounded-full bg-sand" /></div>
        <div className="flex items-start justify-between gap-3 px-5 pt-3">
          <div>
            <h2 className="font-display text-lg font-semibold text-ink">{item.name}</h2>
            <p className="mt-0.5 text-xs text-ink/60">{item.description}</p>
          </div>
          <button type="button" onClick={onClose} className="flex h-8 w-8 flex-shrink-0 items-center justify-center rounded-full bg-paper text-ink/50 hover:text-ink">✕</button>
        </div>
        <div className="mt-2 flex-1 overflow-y-auto px-5 pb-4">
          {item.modifiers.map(group => (
            <div key={group.name} className="mt-5 first:mt-3">
              <div className="flex items-baseline justify-between">
                <h3 className="text-sm font-semibold text-ink">{group.name}</h3>
                <span className="text-[11px] uppercase tracking-wide text-ink/40">{group.isRequired ? 'Required' : 'Optional'} · {group.selectionType === 'single' ? 'Pick 1' : 'Pick any'}</span>
              </div>
              <div className="mt-2 space-y-2">
                {group.options.map(option => {
                  const isSelected = (selections[group.name] || []).includes(option.name);
                  return (
                    <button key={option.name} type="button" onClick={() => toggleOption(group, option.name)}
                      className={`flex w-full items-center justify-between rounded-xl border px-3 py-2.5 text-left text-sm transition-colors ${isSelected ? 'border-saffron bg-saffron/10' : 'border-sand bg-white'}`}>
                      <span className="flex items-center gap-2">
                        <span className={`flex h-4 w-4 items-center justify-center rounded-full border ${isSelected ? 'border-saffron-dark bg-saffron-dark' : 'border-ink/20'}`}>
                          {isSelected && <span className="h-1.5 w-1.5 rounded-full bg-white" />}
                        </span>
                        {option.name}
                      </span>
                      {option.priceDelta !== 0 && <span className="font-mono text-xs text-ink/60">{option.priceDelta > 0 ? '+' : ''}{option.priceDelta.toFixed(2)}</span>}
                    </button>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
        <div className="border-t border-sand px-5 py-4">
          <div className="mb-3 flex items-center justify-between">
            <span className="text-sm font-medium text-ink/70">Quantity</span>
            <div className="flex items-center gap-3">
              <button type="button" onClick={() => setQuantity(q => Math.max(1, q - 1))} className="flex h-8 w-8 items-center justify-center rounded-full bg-paper text-ink">−</button>
              <span className="w-5 text-center font-mono text-sm">{quantity}</span>
              <button type="button" onClick={() => setQuantity(q => q + 1)} className="flex h-8 w-8 items-center justify-center rounded-full bg-paper text-ink">+</button>
            </div>
          </div>
          <button type="button" disabled={Boolean(missingRequired)} onClick={() => onConfirm(flatModifiers, quantity)}
            className="flex w-full items-center justify-between rounded-2xl bg-chili px-5 py-3.5 text-paper shadow-md shadow-chili/30 transition-opacity disabled:cursor-not-allowed disabled:opacity-40">
            <span className="font-semibold">{missingRequired ? `Select ${missingRequired.name}` : 'Add to cart'}</span>
            <span className="font-mono font-semibold">{(unitPrice * quantity).toFixed(2)}</span>
          </button>
        </div>
      </div>
    </div>
  );
}

            <div className="leading-tight">
              <p className="text-[11px] font-medium uppercase tracking-wider text-paper/60">View cart</p>
              <p className="font-display text-sm italic text-paper">{totalItems} {totalItems === 1 ? 'item' : 'items'} added</p>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <span className="font-mono text-base font-semibold text-saffron">{currency} {totalAmount.toFixed(2)}</span>
            <span className="text-paper/70">→</span>
          </div>
        </div>
        <div className="mx-5 mt-3 border-t border-dashed border-paper/20" />
      </button>
    </div>
  );
}

function CartDrawer({ currency, tableNumber, onClose, onCheckout }) {
  const { lines, totalAmount, updateQuantity, removeLine } = useCart();
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center bg-ink/40">

        <div className="flex justify-center pt-3"><span className="h-1 w-10 rounded-full bg-sand" /></div>
        <div className="flex items-center justify-between px-5 pt-3">
          <div>
            <h2 className="font-display text-lg font-semibold text-ink">Your order</h2>
            {tableNumber && <p className="text-xs text-ink/50">Table {tableNumber}</p>}
          </div>
          <button type="button" onClick={onClose} className="flex h-8 w-8 items-center justify-center rounded-full bg-paper text-ink/50 hover:text-ink">✕</button>

        <div className="mt-3 flex-1 overflow-y-auto px-5 pb-4">

            <ul className="space-y-3">

                <li key={line.cartLineId} className="flex gap-3 rounded-xl border border-sand p-3">

                  <div className="flex min-w-0 flex-1 flex-col">
                    <div className="flex items-start justify-between gap-2">
                      <p className="truncate text-sm font-semibold text-ink">{line.name}</p>
                      <button type="button" onClick={() => removeLine(line.cartLineId)} className="text-xs text-ink/40 hover:text-chili">Remove</button>
                    </div>
                    {line.modifiers.length > 0 && <p className="mt-0.5 truncate text-[11px] text-ink/50">{line.modifiers.map(m => m.optionName).join(', ')}</p>}
                    <div className="mt-2 flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <button type="button" onClick={() => updateQuantity(line.cartLineId, line.quantity - 1)} className="flex h-6 w-6 items-center justify-center rounded-full bg-paper text-xs text-ink">−</button>
                        <span className="w-4 text-center font-mono text-xs">{line.quantity}</span>
                        <button type="button" onClick={() => updateQuantity(line.cartLineId, line.quantity + 1)} className="flex h-6 w-6 items-center justify-center rounded-full bg-paper text-xs text-ink">+</button>
                      </div>
                      <span className="font-mono text-sm font-semibold text-ink">{currency} {(line.unitPrice * line.quantity).toFixed(2)}</span>
                    </div>
                  </div>
                </li>
              ))}
            </ul>
          )}
        </div>
        <div className="border-t border-sand px-5 py-4">
          <div className="mb-3 flex items-center justify-between text-sm">
            <span className="text-ink/60">Total</span>
            <span className="font-mono text-lg font-semibold text-ink">{currency} {totalAmount.toFixed(2)}</span>
          </div>
          <button type="button" disabled={lines.length === 0} onClick={onCheckout}
            className="w-full rounded-2xl bg-chili py-3.5 text-center font-semibold text-paper shadow-md shadow-chili/30 transition-opacity disabled:cursor-not-allowed disabled:opacity-40">
            Place order
          </button>
        </div>
      </div>
    </div>
  );
}

        <h2 className="mt-4 font-display text-xl font-semibold text-ink">Order sent to the kitchen</h2>
        <p className="mt-1 font-mono text-sm text-ink/50">#{order.orderNumber}</p>
        <div className="mx-auto mt-4 inline-flex items-center gap-2 rounded-full bg-saffron/15 px-4 py-1.5">
          <span className="h-1.5 w-1.5 animate-pulse rounded-full bg-saffron-dark" />
          <span className="font-mono text-xs font-semibold uppercase tracking-wide text-saffron-dark">{liveStatus}</span>
        </div>
        <button type="button" onClick={onClose} className="mt-6 w-full rounded-2xl bg-basil py-3 font-semibold text-paper">Back to menu</button>
      </div>
    </div>
  );
}

function MenuApp() {
  const params = new URLSearchParams(window.location.search);
  const tableNumber = params.get('table') || '5';
  const [activeCategory, setActiveCategory] = useState('All');
  const [activeModifierItem, setActiveModifierItem] = useState(null);
  const [isCartOpen, setIsCartOpen] = useState(false);
  const [confirmedOrder, setConfirmedOrder] = useState(null);
  const [liveStatus, setLiveStatus] = useState(null);
  const [adminWindowOpen, setAdminWindowOpen] = useState(false);
  const { addItem, lines, clearCart, totalAmount } = useCart();
  const currency = MOCK_RESTAURANT.currency;
  const orderCounterRef = React.useRef(1);

  const visibleItems = activeCategory === 'All' ? Object.values(MOCK_MENU).flat() : (MOCK_MENU[activeCategory] || []);

  const handleAddDirect = (item, modifiers, quantity = 1) => {
    addItem({ itemId: item._id, name: item.name, basePrice: item.price, quantity, modifiers, image: item.images[0] });
  };

  const handleModifierConfirm = (modifiers, quantity) => {
    handleAddDirect(activeModifierItem, modifiers, quantity);
    setActiveModifierItem(null);
  };

  const handleOpenAdminDashboard = () => {
    const adminWin = window.open('preview-admin.html', 'simenu-admin-demo', 'width=480,height=850');
    demoBridge.setRemote(adminWin);
    setAdminWindowOpen(true);
  };

  // Mirrors the real payload shape returned by the backend's Order model, so
  // the admin dashboard preview can render it with the exact same component
  // (OrderCard) the real app uses.
  const handleCheckout = () => {
    const orderNumber = `SF-${String(orderCounterRef.current).padStart(6, '0')}`;
    orderCounterRef.current += 1;

    const order = {
      _id: `demo-${Date.now()}`,
      orderNumber,
      tableNumber,
      items: lines.map((line) => ({
        name: line.name,
        quantity: line.quantity,
        selectedModifiers: line.modifiers,
        lineTotal: line.unitPrice * line.quantity,
      })),
      totalAmount,
      paymentMethod: 'Cash',
      orderStatus: 'Pending',
      createdAt: new Date().toISOString(),
    };

    // Same event name/shape as the real 'new-order' broadcast the backend
    // sends to `restaurant:<id>:admin` after a socket 'place-order' event.
    demoBridge.emit('new-order', order);

    setConfirmedOrder(order);
    setLiveStatus('Pending');
    clearCart();
    setIsCartOpen(false);
  };

  // Listens for the same 'order-status-updated' event shape the real
  // customer socket receives on its private `order:<id>` room.
  useEffect(() => {
    if (!confirmedOrder) return undefined;
    const handleStatusUpdate = (payload) => {
      if (payload.orderId === confirmedOrder._id) setLiveStatus(payload.orderStatus);
    };
    demoBridge.on('order-status-updated', handleStatusUpdate);
    return () => demoBridge.off('order-status-updated', handleStatusUpdate);
  }, [confirmedOrder]);

  return (
    <div className="min-h-screen bg-paper pb-32">
      <Header restaurant={MOCK_RESTAURANT} tableNumber={tableNumber} />

      <div className="mx-auto max-w-lg px-4 pt-3">
        <button
          type="button"
          onClick={handleOpenAdminDashboard}
          className="w-full rounded-xl border border-dashed border-basil/40 bg-basil/5 px-4 py-2 text-xs font-semibold text-basil"
        >
          {adminWindowOpen ? '↻ Reopen Live Admin Dashboard (demo)' : '↗ Open Live Admin Dashboard (demo)'}
        </button>
      </div>

      <CategoryBar categories={Object.keys(MOCK_MENU)} activeCategory={activeCategory} onSelect={setActiveCategory} />
      <main className="mx-auto max-w-lg space-y-3 px-4 py-4">
        {visibleItems.map(item => (
          <MenuItemCard key={item._id} item={item} currency={currency} onAddDirect={handleAddDirect} onRequireModifiers={setActiveModifierItem} />
        ))}
      </main>

      <footer className="mx-auto max-w-lg px-4 pb-6 pt-4">
        <div className="border-t border-sand pt-4 text-center">
          <p className="text-xs tracking-wide text-ink/40">
            Powered by <span className="font-semibold text-ink/60">SiMenu</span>
            {' · '}Developed by{' '}
            <a href="https://sayyamijaz.dev" target="_blank" rel="noopener noreferrer nofollow" className="font-medium text-ink/60 underline decoration-sand underline-offset-2 hover:text-chili">
              Sayyamm Ijaz
            </a>
          </p>
        </div>
      </footer>

      <FloatingCartBar currency={currency} onViewCart={() => setIsCartOpen(true)} />
      {activeModifierItem && <ModifierSheet item={activeModifierItem} onConfirm={handleModifierConfirm} onClose={() => setActiveModifierItem(null)} />}
      {isCartOpen && <CartDrawer currency={currency} tableNumber={tableNumber} onClose={() => setIsCartOpen(false)} onCheckout={handleCheckout} />}
      {confirmedOrder && <OrderConfirmedModal order={confirmedOrder} liveStatus={liveStatus} onClose={() => setConfirmedOrder(null)} />}
    </div>
  );
}

function Root() {
  return <CartProvider><MenuApp /></CartProvider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
