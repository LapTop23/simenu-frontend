<body class="font-body text-ink antialiased">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef, useCallback } = React;

// ---------------------------------------------------------------------------
// DEMO DATA — stands in for a live backend connection in this static preview.
// The real project talks to POST/PUT/PATCH/DELETE /api/menu (see
// src/controllers/menu.controller.js) instead of mutating local state.
// ---------------------------------------------------------------------------
const RESTAURANT = { name: 'Savory Foods', slug: 'savory-foods', currency: 'PKR' };

const INITIAL_ITEMS = [
  { _id: '1', name: 'Smoked Beef Stack', category: 'Burgers', price: 950, isAvailable: true, images: ['https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=150&q=80'] },
  { _id: '2', name: 'Classic Zinger', category: 'Burgers', price: 750, isAvailable: true, images: ['https://images.unsplash.com/photo-1550547660-d9450f859349?w=150&q=80'] },
  { _id: '3', name: 'Charcoal Grill Platter', category: 'Platters', price: 1850, isAvailable: false, images: ['https://images.unsplash.com/photo-1544025162-d76694265947?w=150&q=80'] },
  { _id: '4', name: 'Blood Orange Fizz', category: 'Drinks', price: 380, isAvailable: true, images: ['https://images.unsplash.com/photo-1621263764928-df1444c5e859?w=150&q=80'] },
];

// ---------------------------------------------------------------------------
// ToggleSwitch — identical implementation to components/admin/ToggleSwitch.jsx
// ---------------------------------------------------------------------------
function ToggleSwitch({ checked, onChange, label }) {
  return (
    <button type="button" role="switch" aria-checked={checked} aria-label={label} onClick={() => onChange(!checked)}
      className={`relative inline-flex h-6 w-11 flex-shrink-0 items-center rounded-full transition-colors duration-200 ${checked ? 'bg-basil' : 'bg-sand'}`}>
      <span className="inline-block transform rounded-full bg-white shadow-sm transition-transform duration-200"
        style={{ height: '18px', width: '18px', transform: checked ? 'translateX(24px)' : 'translateX(4px)' }} />
    </button>
  );
}

// ---------------------------------------------------------------------------
// Minimal add/edit form — mirrors components/admin/MenuItemForm.jsx's fields
// (name/category/price/description/availability); the full version also
// includes the image-upload and modifiers builder, trimmed here for a
// focused, dependency-free demo.
// ---------------------------------------------------------------------------
function MenuItemFormDemo({ item, onSubmit, onClose }) {
  const [form, setForm] = useState(() => ({
    name: item?.name || '', category: item?.category || '', price: item?.price ?? '',
    description: item?.description || '', isAvailable: item?.isAvailable !== false,
  }));
  const [error, setError] = useState(null);
  const isEditing = Boolean(item);

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!form.name.trim() || !form.category.trim() || form.price === '' || Number(form.price) < 0) {
      setError('Name, category, and a valid non-negative price are required.');
      return;
    }
    onSubmit({ ...form, price: Number(form.price) });
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-ink/40 p-4">
      <form onSubmit={handleSubmit} className="w-full max-w-md rounded-3xl bg-white">
        <div className="flex items-center justify-between border-b border-sand px-6 py-4">
          <h2 className="font-display text-lg font-semibold text-ink">{isEditing ? 'Edit item' : 'Add menu item'}</h2>
          <button type="button" onClick={onClose} className="flex h-8 w-8 items-center justify-center rounded-full bg-paper text-ink/50">✕</button>
        </div>
        <div className="space-y-3 px-6 py-5">
          {error && <p className="rounded-lg bg-chili/10 px-3 py-2 text-xs font-medium text-chili">{error}</p>}
          <label className="block">
            <span className="mb-1 block text-xs font-semibold text-ink/60">Name</span>
            <input type="text" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })}
              className="w-full rounded-lg border border-sand px-3 py-2 text-sm outline-none focus:border-basil" />
          </label>
          <div className="grid grid-cols-2 gap-3">
            <label className="block">
              <span className="mb-1 block text-xs font-semibold text-ink/60">Category</span>
              <input type="text" value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })}
                className="w-full rounded-lg border border-sand px-3 py-2 text-sm outline-none focus:border-basil" />
            </label>
            <label className="block">
              <span className="mb-1 block text-xs font-semibold text-ink/60">Price</span>
              <input type="number" value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value })}
                className="w-full rounded-lg border border-sand px-3 py-2 font-mono text-sm outline-none focus:border-basil" />
            </label>
          </div>
          <label className="block">
            <span className="mb-1 block text-xs font-semibold text-ink/60">Description</span>
            <textarea rows={2} value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })}
              className="w-full resize-none rounded-lg border border-sand px-3 py-2 text-sm outline-none focus:border-basil" />
          </label>
          <div className="flex items-center justify-between rounded-xl bg-paper px-4 py-3">
            <span className="text-sm font-semibold text-ink">Available on menu</span>
            <ToggleSwitch checked={form.isAvailable} onChange={(v) => setForm({ ...form, isAvailable: v })} label="Available" />
          </div>
        </div>
        <div className="border-t border-sand px-6 py-4">
          <button type="submit" className="w-full rounded-2xl bg-chili py-3 font-semibold text-paper shadow-md shadow-chili/30">
            {isEditing ? 'Save changes' : 'Add item'}
          </button>
        </div>
      </form>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Menu Management tab
// ---------------------------------------------------------------------------
function MenuManagementTab() {
  const [items, setItems] = useState(INITIAL_ITEMS);
  const [formTarget, setFormTarget] = useState(undefined);
  const [pendingDeleteId, setPendingDeleteId] = useState(null);

  const grouped = useMemo(() => {
    const groups = {};
    items.forEach((item) => { (groups[item.category] = groups[item.category] || []).push(item); });
    return groups;
  }, [items]);

  const handleToggle = (id, next) => setItems((prev) => prev.map((i) => (i._id === id ? { ...i, isAvailable: next } : i)));

  const handleSubmit = (payload) => {
    if (formTarget && formTarget._id) {
      setItems((prev) => prev.map((i) => (i._id === formTarget._id ? { ...i, ...payload } : i)));
    } else {
      setItems((prev) => [...prev, { ...payload, _id: `demo-${Date.now()}`, images: [] }]);
    }
    setFormTarget(undefined);
  };

  const handleDelete = (id) => {
    setItems((prev) => prev.filter((i) => i._id !== id));
    setPendingDeleteId(null);
  };

  return (
    <div>
      <div className="flex items-center justify-between">
        <h2 className="font-display text-lg italic text-ink">Menu items ({items.length})</h2>
        <button type="button" onClick={() => setFormTarget(null)} className="rounded-full bg-chili px-4 py-2 text-sm font-semibold text-paper shadow-sm shadow-chili/30">
          + Add item
        </button>
      </div>

      <div className="mt-4 space-y-6">
        {Object.entries(grouped).map(([category, categoryItems]) => (
          <div key={category}>
            <h3 className="mb-2 text-xs font-semibold uppercase tracking-wide text-ink/40">{category}</h3>
            <div className="overflow-hidden rounded-2xl border border-sand bg-white">
              {categoryItems.map((item, index) => (
                <div key={item._id} className={`flex items-center gap-3 px-4 py-3 ${index > 0 ? 'border-t border-sand' : ''}`}>
                  <img src={item.images[0]} alt="" className={`h-12 w-12 flex-shrink-0 rounded-lg object-cover ${!item.isAvailable ? 'grayscale' : ''}`} />
                  <div className="min-w-0 flex-1">
                    <p className="truncate text-sm font-semibold text-ink">{item.name}</p>
                    <p className="font-mono text-xs text-ink/50">{RESTAURANT.currency} {item.price.toFixed(2)}</p>
                  </div>
                  <ToggleSwitch checked={item.isAvailable} onChange={(next) => handleToggle(item._id, next)} label={`Toggle ${item.name}`} />
                  <button type="button" onClick={() => setFormTarget(item)} className="rounded-lg bg-paper px-2.5 py-1.5 text-xs font-semibold text-ink hover:bg-sand">Edit</button>
                  {pendingDeleteId === item._id ? (
                    <div className="flex items-center gap-1">
                      <button type="button" onClick={() => handleDelete(item._id)} className="rounded-lg bg-chili px-2.5 py-1.5 text-xs font-semibold text-paper">Confirm</button>
                      <button type="button" onClick={() => setPendingDeleteId(null)} className="rounded-lg bg-paper px-2 py-1.5 text-xs text-ink/50">Cancel</button>
                    </div>
                  ) : (
                    <button type="button" onClick={() => setPendingDeleteId(item._id)} className="rounded-lg px-2.5 py-1.5 text-xs font-semibold text-chili hover:bg-chili/10">Delete</button>
                  )}
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>

      {formTarget !== undefined && <MenuItemFormDemo item={formTarget} onSubmit={handleSubmit} onClose={() => setFormTarget(undefined)} />}
    </div>
  );
}

// ---------------------------------------------------------------------------
// QR code canvas — wraps the QRious library (CDN, canvas-based) since this
// static preview has no bundler to pull in qrcode.react's React component.
// The real project uses <QRCodeSVG> from qrcode.react (see
// components/admin/QRTableCard.jsx) for lossless vector scaling at print
// resolution; QRious's canvas output is a faithful visual stand-in here.
// ---------------------------------------------------------------------------
function QRCanvas({ value, size }) {
  const containerRef = useRef(null);
  useEffect(() => {
    if (containerRef.current && window.QRCode) {
      containerRef.current.innerHTML = '';
      new QRCode(containerRef.current, {
        text: value, width: size, height: size,
        colorDark: '#1B1F1C', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M,
      });
    }
  }, [value, size]);
  return <div ref={containerRef} style={{ width: size, height: size }} />;
}

function QRTableCard({ restaurantName, tableNumber, targetUrl }) {
  return (
    <div className="qr-print-card flex flex-col items-center rounded-2xl border border-sand bg-white px-6 py-8 text-center shadow-sm shadow-ink/5">
      <p className="text-[11px] font-semibold uppercase tracking-[0.2em] text-ink/40">Welcome to</p>
      <h2 className="mt-1 font-display text-xl italic leading-tight text-ink">{restaurantName}</h2>
      <div className="my-6 rounded-xl border border-sand p-3">
        <QRCanvas value={targetUrl} size={168} />
      </div>
      <p className="font-mono text-lg font-bold tracking-wide text-ink">TABLE # {String(tableNumber).padStart(2, '0')}</p>
      <p className="mt-1 text-xs uppercase tracking-wide text-ink/50">(Scan to Order &amp; Pay)</p>
      <div className="my-4 w-full border-t border-dashed border-sand" />
      <p className="text-[10px] tracking-wide text-ink/40">Powered by <span className="font-semibold text-ink/60">SiMenu</span> · By Sayyam Ijaz</p>
    </div>
  );
}

function QRGeneratorTab() {
  const [tableCountInput, setTableCountInput] = useState('12');
  const [committedCount, setCommittedCount] = useState(12);
  const tableNumbers = useMemo(() => Array.from({ length: committedCount }, (_, i) => i + 1), [committedCount]);
  const buildUrl = (n) => `https://simenu.com/menu?res=${RESTAURANT.slug}&table=${n}`;

  const handleGenerate = (e) => {
    e.preventDefault();
    setCommittedCount(Math.max(1, Math.min(200, Math.floor(Number(tableCountInput)) || 0)));
  };

  return (
    <div>
      <div className="no-print flex flex-wrap items-end justify-between gap-4">
        <form onSubmit={handleGenerate} className="flex items-end gap-3">
          <label className="block">
            <span className="mb-1 block text-xs font-semibold text-ink/60">Number of tables</span>
            <input type="number" min="1" max="200" value={tableCountInput} onChange={(e) => setTableCountInput(e.target.value)}
              className="w-28 rounded-lg border border-sand px-3 py-2 font-mono text-sm outline-none focus:border-basil" />
          </label>
          <button type="submit" className="rounded-lg bg-basil px-4 py-2 text-sm font-semibold text-paper shadow-sm">Generate</button>
        </form>
        <button type="button" onClick={() => window.print()} className="rounded-full bg-chili px-5 py-2.5 text-sm font-semibold text-paper shadow-sm shadow-chili/30">
          🖨 Print QR Codes
        </button>
      </div>

      <div className="qr-print-page mt-6 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
        {tableNumbers.map((n) => (
          <QRTableCard key={n} restaurantName={RESTAURANT.name} tableNumber={n} targetUrl={buildUrl(n)} />
        ))}
      </div>
    </div>
  );
}

function Dashboard() {
  const [tab, setTab] = useState('menu');
  return (
    <div className="min-h-screen bg-paper">
      <header className="no-print sticky top-0 z-20 border-b border-sand bg-white">
        <div className="mx-auto max-w-5xl px-5 py-4">
          <h1 className="font-display text-xl italic text-ink">{RESTAURANT.name} — Owner Dashboard</h1>
          <div className="mt-3 flex gap-2">
            {[{ id: 'menu', label: 'Menu Management' }, { id: 'qr', label: 'Table QR Codes' }].map((t) => (
              <button key={t.id} type="button" onClick={() => setTab(t.id)}
                className={`rounded-full border px-4 py-1.5 text-sm font-semibold transition-colors ${tab === t.id ? 'border-basil bg-basil text-paper' : 'border-sand bg-white text-ink/60 hover:text-ink'}`}>
                {t.label}
              </button>
            ))}
          </div>
        </div>
      </header>
      <main className="mx-auto max-w-5xl px-5 py-6">
        {tab === 'menu' ? <MenuManagementTab /> : <QRGeneratorTab />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
</script>
</body>
</html>
