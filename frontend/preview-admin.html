<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SiMenu — Live Admin Dashboard (Demo)</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#1B1F1C',
          paper: '#F6F5F1',
          chili: { DEFAULT: '#D62828', dark: '#B01F1F' },
          saffron: { DEFAULT: '#E7A94C', dark: '#C98A2E' },
          basil: { DEFAULT: '#1F4D3D', dark: '#153A2D' },
          sand: '#E7E2D8',
        },
        fontFamily: {
          display: ['"Fraunces"', 'ui-serif', 'serif'],
          body: ['"Inter"', 'ui-sans-serif', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
        },
        keyframes: {
          'pop-in': { '0%': { transform: 'scale(0.85)', opacity: 0 }, '100%': { transform: 'scale(1)', opacity: 1 } },
        },
        animation: {
          'pop-in': 'pop-in 220ms cubic-bezier(0.22, 1, 0.36, 1)',
        },
      },
    },
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  body { background: #1B1F1C; }
  .ticket-edge {
    --scallop: 22px;
    -webkit-mask:
      radial-gradient(circle at 50% 0, transparent calc(var(--scallop) / 2 - 1px), #000 calc(var(--scallop) / 2)) top / var(--scallop) calc(var(--scallop) / 2) repeat-x,
      linear-gradient(#000, #000) bottom / 100% calc(100% - var(--scallop) / 2) no-repeat;
    mask:
      radial-gradient(circle at 50% 0, transparent calc(var(--scallop) / 2 - 1px), #000 calc(var(--scallop) / 2)) top / var(--scallop) calc(var(--scallop) / 2) repeat-x,
      linear-gradient(#000, #000) bottom / 100% calc(100% - var(--scallop) / 2) no-repeat;
  }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="font-body text-ink antialiased">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

// ---------------------------------------------------------------------------
// DEMO TRANSPORT — see the matching comment in preview.html. This bridge
// reproduces Socket.IO's event shape (on/off/emit) over window.postMessage so
// this tab and the customer tab (preview.html) can talk to each other without
// a running server. The real Next.js source uses actual socket.io-client.
// ---------------------------------------------------------------------------
function createDemoBridge() {
  const listeners = {};
  let remoteWindow = null;

  window.addEventListener('message', (event) => {
    if (!event.data || event.data.__simenuDemo !== true) return;
    const { eventName, payload } = event.data;
    (listeners[eventName] || []).forEach((fn) => fn(payload));
  });

  return {
    on(eventName, fn) { (listeners[eventName] = listeners[eventName] || []).push(fn); },
    off(eventName, fn) { listeners[eventName] = (listeners[eventName] || []).filter((f) => f !== fn); },
    setRemote(win) { remoteWindow = win; },
    emit(eventName, payload) {
      if (remoteWindow && !remoteWindow.closed) {
        remoteWindow.postMessage({ __simenuDemo: true, eventName, payload }, '*');
      }
    },
  };
}

const demoBridge = createDemoBridge();
demoBridge.setRemote(window.opener || null);

// ---------------------------------------------------------------------------
// Notification chime — identical implementation to hooks/useNotificationChime.js
// ---------------------------------------------------------------------------
function useNotificationChime() {
  const ctxRef = React.useRef(null);
  return useCallback(() => {
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      if (!ctxRef.current) ctxRef.current = new AudioContextClass();
      const ctx = ctxRef.current;
      const now = ctx.currentTime;
      [784, 1046].forEach((frequency, index) => {
        const startTime = now + index * 0.11;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = frequency;
        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(0.18, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.32);
        osc.connect(gain).connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + 0.35);
      });
    } catch (e) { console.warn('Unable to play notification sound', e); }
  }, []);
}

// ---------------------------------------------------------------------------
// StatusPill + OrderCard — mirror components/admin/StatusPill.jsx and
// components/admin/OrderCard.jsx from the real Next.js source exactly.
// ---------------------------------------------------------------------------
const STATUS_STYLES = {
  Pending: 'bg-sand text-ink/70 border-ink/10',
  Preparing: 'bg-saffron/20 text-saffron-dark border-saffron/40',
  Ready: 'bg-basil/15 text-basil border-basil/30',
  Completed: 'bg-ink/5 text-ink/40 border-ink/10',
  Cancelled: 'bg-chili/10 text-chili border-chili/30',
};

function StatusPill({ status }) {
  const style = STATUS_STYLES[status] || STATUS_STYLES.Pending;
  return (
    <span className={`inline-flex items-center rounded-full border px-2.5 py-0.5 font-mono text-[11px] font-semibold uppercase tracking-wide ${style}`}>
      {status}
    </span>
  );
}

const STATUS_FLOW = ['Pending', 'Preparing', 'Ready', 'Completed'];

function OrderCard({ order, currency, onStatusChange, isNew }) {
  const [timeAgoLabel, setTimeAgoLabel] = useState(() => formatTimeAgo(order.createdAt));

  useEffect(() => {
    const interval = setInterval(() => setTimeAgoLabel(formatTimeAgo(order.createdAt)), 30000);
    return () => clearInterval(interval);
  }, [order.createdAt]);

  const currentIndex = STATUS_FLOW.indexOf(order.orderStatus);
  const nextStatus = currentIndex >= 0 && currentIndex < STATUS_FLOW.length - 1 ? STATUS_FLOW[currentIndex + 1] : null;
  const isTerminal = order.orderStatus === 'Completed' || order.orderStatus === 'Cancelled';

  return (
    <article className={`ticket-edge overflow-hidden rounded-b-2xl border border-sand bg-white pt-4 shadow-sm shadow-ink/5 ${isNew ? 'animate-pop-in ring-2 ring-saffron' : ''}`}>
      <div className="px-4">
        <div className="flex items-start justify-between gap-2">
          <div>
            <p className="font-mono text-xs font-semibold uppercase tracking-wide text-ink/40">#{order.orderNumber}</p>
            <h3 className="mt-0.5 font-display text-lg font-semibold leading-tight text-ink">Table {order.tableNumber}</h3>
          </div>
          <div className="text-right">
            <StatusPill status={order.orderStatus} />
            <p className="mt-1 text-[11px] text-ink/40">{timeAgoLabel}</p>
          </div>
        </div>

        <ul className="mt-3 space-y-1.5 border-t border-dashed border-sand pt-3">
          {order.items.map((item, index) => (
            <li key={index} className="flex items-baseline justify-between gap-3 text-sm">
              <span className="text-ink/80">
                <span className="font-mono text-xs text-ink/40">{item.quantity}×</span> {item.name}
                {item.selectedModifiers?.length > 0 && (
                  <span className="block text-[11px] text-ink/40">{item.selectedModifiers.map(m => m.optionName).join(', ')}</span>
                )}
              </span>
              <span className="flex-shrink-0 font-mono text-xs text-ink/50">{currency} {item.lineTotal.toFixed(2)}</span>
            </li>
          ))}
        </ul>

        <div className="mt-3 flex items-center justify-between border-t border-sand pt-3">
          <span className="text-xs font-medium text-ink/50">{order.paymentMethod === 'Digital_Wallet' ? 'Digital Wallet' : 'Cash'}</span>
          <span className="font-mono text-base font-bold text-ink">{currency} {order.totalAmount.toFixed(2)}</span>
        </div>
      </div>

      <div className="mx-4 mt-3 border-t border-dashed border-sand" />

      <div className="flex items-center gap-2 px-4 py-3">
        <select
          value={order.orderStatus}
          onChange={(e) => onStatusChange(order._id, e.target.value)}
          disabled={isTerminal}
          className="flex-1 rounded-lg border border-sand bg-paper px-2.5 py-1.5 text-xs font-semibold text-ink disabled:cursor-not-allowed disabled:opacity-50"
        >
          {[...STATUS_FLOW, 'Cancelled'].map(s => <option key={s} value={s}>{s}</option>)}
        </select>
        {nextStatus && (
          <button type="button" onClick={() => onStatusChange(order._id, nextStatus)}
            className="flex-shrink-0 rounded-lg bg-basil px-3 py-1.5 text-xs font-semibold text-paper transition-transform active:scale-95">
            Mark {nextStatus} →
          </button>
        )}
      </div>
    </article>
  );
}

function formatTimeAgo(dateString) {
  const seconds = Math.floor((Date.now() - new Date(dateString).getTime()) / 1000);
  if (seconds < 60) return 'Just now';
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `${minutes} min ago`;
  const hours = Math.floor(minutes / 60);
  return `${hours}h ${minutes % 60}m ago`;
}

const FILTER_TABS = ['All', 'Pending', 'Preparing', 'Ready', 'Completed'];

function AdminDashboard() {
  const [orders, setOrders] = useState([]);
  const [activeFilter, setActiveFilter] = useState('All');
  const [newOrderId, setNewOrderId] = useState(null);
  const playChime = useNotificationChime();

  // Listens for 'new-order' the same way the real admin dashboard's
  // useAdminOrders hook does — added once, cleaned up on unmount.
  useEffect(() => {
    const handleNewOrder = (order) => {
      setOrders(prev => prev.some(o => o._id === order._id) ? prev : [...prev, order]);
      setNewOrderId(order._id);
      playChime();
    };
    demoBridge.on('new-order', handleNewOrder);
    return () => demoBridge.off('new-order', handleNewOrder);
  }, [playChime]);

  const updateStatus = useCallback((orderId, orderStatus) => {
    setOrders(prev => prev.map(o => o._id === orderId ? { ...o, orderStatus } : o));
    // Same event name/shape as the real backend's broadcast to `order:<id>`.
    demoBridge.emit('order-status-updated', { orderId, orderStatus });
  }, []);

  const filteredOrders = useMemo(() => {
    const list = activeFilter === 'All' ? orders : orders.filter(o => o.orderStatus === activeFilter);
    return [...list].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
  }, [orders, activeFilter]);

  const counts = useMemo(() => {
    const base = { Pending: 0, Preparing: 0, Ready: 0, Completed: 0 };
    orders.forEach(o => { if (base[o.orderStatus] !== undefined) base[o.orderStatus] += 1; });
    return base;
  }, [orders]);

  return (
    <div className="min-h-screen bg-paper">
      <header className="sticky top-0 z-20 bg-ink text-paper shadow-md">
        <div className="mx-auto flex max-w-3xl flex-wrap items-center justify-between gap-3 px-5 py-4">
          <div>
            <h1 className="font-display text-xl italic text-paper">Savory Foods — Live Orders</h1>
            <div className="mt-1 flex items-center gap-1.5">
              <span className="h-1.5 w-1.5 animate-pulse rounded-full bg-saffron" />
              <span className="text-[11px] uppercase tracking-wider text-paper/50">Connected · live</span>
            </div>
          </div>
          <div className="flex gap-3 font-mono text-xs">
            {Object.entries(counts).map(([label, count]) => (
              <div key={label} className="rounded-lg bg-white/5 px-3 py-1.5 text-center">
                <p className="text-sm font-bold text-saffron">{count}</p>
                <p className="text-[10px] uppercase tracking-wide text-paper/40">{label}</p>
              </div>
            ))}
          </div>
        </div>
        <div className="no-scrollbar mx-auto flex max-w-3xl gap-2 overflow-x-auto px-5 pb-3">
          {FILTER_TABS.map(tab => {
            const isActive = tab === activeFilter;
            return (
              <button key={tab} type="button" onClick={() => setActiveFilter(tab)}
                className={`flex-shrink-0 rounded-full border px-3.5 py-1 text-xs font-semibold transition-colors ${isActive ? 'border-saffron bg-saffron text-ink' : 'border-white/15 bg-transparent text-paper/60 hover:text-paper'}`}>
                {tab}
              </button>
            );
          })}
        </div>
      </header>

      <main className="mx-auto max-w-3xl px-5 py-6">
        {filteredOrders.length === 0 ? (
          <p className="py-24 text-center text-sm text-ink/40">
            Waiting for orders… place one from the SiMenu customer tab to see it arrive here instantly.
          </p>
        ) : (
          <div className="grid grid-cols-1 gap-4 sm:grid-cols-2">
            {filteredOrders.map(order => (
              <OrderCard key={order._id} order={order} currency="PKR" onStatusChange={updateStatus} isNew={order._id === newOrderId} />
            ))}
          </div>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AdminDashboard />);
</script>
</body>
</html>
